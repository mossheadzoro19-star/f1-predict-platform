[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-predict-platform"
version = "0.1.0"
description = "Historical and real-time Formula 1 race intelligence and winner-probability research platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pandas>=2.2,<4",
  "pydantic>=2.8,<3",
  "python-dateutil>=2.9,<3",
  "pyarrow>=16,<22"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2"
]

[tool.setuptools.packages.find]
include = ["f1_predict*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
